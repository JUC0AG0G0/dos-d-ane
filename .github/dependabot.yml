# Mises à jour de dépendances proposées chaque semaine, vers develop.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/apps/backend", "/apps/web"]
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Le mobile suit les versions du SDK Expo : on le met à jour avec `npx expo install --fix`.
  - package-ecosystem: pip
    directory: /apps/sensors
    target-branch: develop
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/apps/backend", "/apps/web"]
    target-branch: develop
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
