name: CI

# Lint et compilation du serveur et du client, tests de l'algorithme edge
# (Python), vérifications de l'app mobile, stack de production lancée dans Docker,
# secrets de production, puis déploiement sur le VPS à chaque push sur develop.
# Le job « ci-ok » résume les vérifications pour la protection de branche.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Sur develop, un déploiement en cours n'est jamais interrompu.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  # Mêmes tâches (Taskfile.yml) que les hooks Husky en local.
  # mise-action installe Node et task aux versions de mise.toml.
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Installer
        run: task setup
      - name: Lint
        run: task lint
      - name: Compilation
        run: task server:build client:build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Valider les fichiers compose
        run: docker compose --env-file .env.dev.example -f compose.yaml -f compose.dev.yaml config -q
      # Stack de production complète (images, migrations, API, nginx) avec des
      # valeurs de test, jamais utilisées ailleurs.
      - name: Lancer la stack de production
        run: |
          cat > .env.prod <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-password
          POSTGRES_DB=ci
          JWT_SECRET=ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
          ADMIN_EMAIL=admin@ci.test
          ADMIN_PASSWORD=ci-admin-password
          S3_ACCESS_KEY=ci
          S3_SECRET_KEY=ci-s3-secret
          EOF
          docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml -f compose.vps.yaml config -q
          docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up -d --build --wait --wait-timeout 300
      - name: Vérifier l'API à travers nginx
        run: curl -fsS http://localhost/api/health | tee /dev/stderr | jq -e '.status == "ok" and .env == "production"'
      - name: Logs
        if: failure()
        run: docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml logs

  # Tests de l'algorithme de posture du Raspberry Pi (edge/), sans webcam ni modèle.
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Tests de l'algorithme de posture
        run: task edge:test

  # App mobile (Expo) : typecheck, lint, tests et page d'analyse à jour.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Vérifications de l'app mobile
        run: task mobile:check

  # Tous les secrets de .env.prod.example doivent exister avant le merge.
  # Les PR venant d'un fork n'ont pas accès aux secrets : vérifiées au push.
  prod-secrets:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vérifier les secrets de production
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: sh scripts/prod-secrets.sh check

  ci-ok:
    if: always()
    needs: [apps, edge, mobile, docker, prod-secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que tous les jobs ont réussi
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Au moins un job a échoué."
            exit 1
          fi

  # Après une CI verte sur develop (push ou relance manuelle), sur le runner
  # auto-hébergé installé sur le VPS (guide : deployReadME.md).
  deploy:
    needs: ci-ok
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: [self-hosted, dos-d-ane-vps]
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TARGET: /opt/dos-d-ane
    steps:
      - uses: actions/checkout@v5
      - name: Préparer la nouvelle version
        run: |
          rm -rf "$TARGET/next" && mkdir -p "$TARGET/next"
          git archive --format=tar HEAD | tar -x -C "$TARGET/next"
      - name: Vérifier les secrets et écrire .env.prod
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: sh scripts/prod-secrets.sh write "$TARGET/next/.env.prod"
      - name: Construire et démarrer
        run: sh "$TARGET/next/scripts/deploy.sh" "$GITHUB_SHA"
