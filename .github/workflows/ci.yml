name: CI

# Sur une PR, seules les apps dont les fichiers ont changé sont vérifiées
# (serveur, client, stack Docker, algorithme edge, app mobile). Un label au nom
# de l'app (server, client, docker, edge, mobile) force en plus sa vérification.
# Au push sur develop et en relance manuelle, tout est vérifié avant le
# déploiement sur le VPS. Le job « ci-ok » résume les vérifications pour la
# protection de branche (un job sauté compte comme réussi).
on:
  pull_request:
    branches: [develop]
    # labeled : relance la CI quand un label est ajouté.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Sur develop, un déploiement en cours n'est jamais interrompu.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  # Choisit les apps à vérifier : fichiers modifiés par la PR, labels de la PR,
  # ou tout hors PR. Un changement de la CI ou des outils vérifie tout.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server == 'true' || contains(github.event.pull_request.labels.*.name, 'server') }}
      client: ${{ github.event_name != 'pull_request' || steps.filter.outputs.client == 'true' || contains(github.event.pull_request.labels.*.name, 'client') }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' || contains(github.event.pull_request.labels.*.name, 'docker') }}
      edge: ${{ github.event_name != 'pull_request' || steps.filter.outputs.edge == 'true' || contains(github.event.pull_request.labels.*.name, 'edge') }}
      mobile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mobile == 'true' || contains(github.event.pull_request.labels.*.name, 'mobile') }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            common: &common
              - .github/workflows/ci.yml
              - Taskfile.yml
              - mise.toml
            server:
              - *common
              - server/**
            client:
              - *common
              - client/**
            docker:
              - *common
              - compose*.yaml
              - .env.*.example
              - server/Dockerfile
              - server/.dockerignore
              - server/package*.json
              - server/prisma/**
              - client/Dockerfile
              - client/.dockerignore
              - client/package*.json
              - client/nginx.conf
            edge:
              - *common
              - edge/**
            mobile:
              - *common
              - mobile/**

  # Mêmes tâches (Taskfile.yml) que les hooks Husky en local.
  # mise-action installe Node et task aux versions de mise.toml.
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Lint et typecheck du serveur
        run: task server:check

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Lint et compilation du client
        run: task client:check

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Valider les fichiers compose
        run: docker compose --env-file .env.dev.example -f compose.yaml -f compose.dev.yaml config -q
      # Stack de production complète (images, migrations, API, nginx) avec des
      # valeurs de test, jamais utilisées ailleurs.
      - name: Lancer la stack de production
        run: |
          cat > .env.prod <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-password
          POSTGRES_DB=ci
          JWT_SECRET=ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
          ADMIN_EMAIL=admin@ci.test
          ADMIN_PASSWORD=ci-admin-password
          S3_ACCESS_KEY=ci
          S3_SECRET_KEY=ci-s3-secret
          EOF
          docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml -f compose.vps.yaml config -q
          docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up -d --build --wait --wait-timeout 300
      - name: Vérifier l'API à travers nginx
        run: curl -fsS http://localhost/api/health | tee /dev/stderr | jq -e '.status == "ok" and .env == "production"'
      - name: Logs
        if: failure()
        run: docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml logs

  # Tests de l'algorithme de posture du Raspberry Pi (edge/), sans webcam ni modèle.
  edge:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Tests de l'algorithme de posture
        run: task edge:test

  # App mobile (Expo) : typecheck, lint, tests et page d'analyse à jour.
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Vérifications de l'app mobile
        run: task mobile:check

  # Tous les secrets de .env.prod.example doivent exister avant le merge.
  # Les PR venant d'un fork n'ont pas accès aux secrets : vérifiées au push.
  prod-secrets:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vérifier les secrets de production
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: sh scripts/prod-secrets.sh check

  ci-ok:
    if: always()
    needs: [changes, server, client, edge, mobile, docker, prod-secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que tous les jobs ont réussi
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Au moins un job a échoué."
            exit 1
          fi

  # Après une CI verte sur develop (push ou relance manuelle), sur le runner
  # auto-hébergé installé sur le VPS (guide : deployReadME.md).
  deploy:
    needs: ci-ok
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: [self-hosted, dos-d-ane-vps]
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TARGET: /opt/dos-d-ane
    steps:
      - uses: actions/checkout@v5
      - name: Préparer la nouvelle version
        run: |
          rm -rf "$TARGET/next" && mkdir -p "$TARGET/next"
          git archive --format=tar HEAD | tar -x -C "$TARGET/next"
      - name: Vérifier les secrets et écrire .env.prod
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: sh scripts/prod-secrets.sh write "$TARGET/next/.env.prod"
      - name: Construire et démarrer
        run: sh "$TARGET/next/scripts/deploy.sh" "$GITHUB_SHA"
