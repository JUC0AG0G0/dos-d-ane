name: CI

# PR vers develop : ne vérifie que les apps modifiées (commande « check » de
# .github/apps.json : lint et compilation, tests de edge et desktop), sans
# lancer Docker sauf si un Dockerfile, nginx.conf ou un fichier compose
# change. La construction des images et le test de la stack se font après le
# merge, sur develop (preprod.yml). Les PR vers main sont gérées par release.yml.
# Le job « ci-ok » résume les vérifications pour la protection de branche.
on:
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.changed.outputs.checks }}
      docker: ${{ steps.changed.outputs.docker }}
      compose: ${{ steps.changed.outputs.compose }}
      api_docs: ${{ steps.changed.outputs.api_docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changed
        run: node scripts/release.mjs changed "origin/${{ github.base_ref }}"

  # Mêmes tâches (Taskfile.yml) que les hooks Husky en local.
  # mise-action installe Node, Python et task aux versions de mise.toml.
  apps:
    needs: changes
    if: needs.changes.outputs.checks != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.checks) }}
    name: apps (${{ matrix.app }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Vérifier ${{ matrix.app }}
        run: ${{ matrix.check }}

  # Un contrôleur ou un DTO a changé : server/ROUTES.md et openapi.json
  # doivent avoir été régénérés (hook pre-commit ou `task api:docs`).
  api-docs:
    needs: changes
    if: needs.changes.outputs.api_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Vérifier ROUTES.md et openapi.json
        run: task api:docs -- --check

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Valider les fichiers compose
        run: |
          docker compose --env-file .env.dev.example -f compose.yaml -f compose.dev.yaml config -q
          # Production : chaque variable de .env.prod.example reçoit une valeur factice.
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci/' .env.prod.example > .env.prod
          SERVER_TAG=ci CLIENT_TAG=ci docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml config -q

  # Construit (sans publier) les images dont le Dockerfile ou nginx.conf a
  # changé. Le cache est partagé avec la préprod, qui ira donc vite.
  docker:
    needs: changes
    if: needs.changes.outputs.docker != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.docker) }}
    name: docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:${{ matrix.context }}"
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}

  ci-ok:
    if: always()
    needs: [changes, apps, api-docs, compose, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que tous les jobs ont réussi
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Au moins un job a échoué."
            exit 1
          fi
