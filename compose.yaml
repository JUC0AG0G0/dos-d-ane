# Stack de Dos d'âne : serveur (API NestJS) et base de données.
# Toutes les valeurs viennent du fichier d'environnement choisi :
#   docker compose --env-file .env.staging up -d
# (voir docs/deploiement.md, ou `task up ENV=staging`).
name: dos-d-ane-${APP_ENV:?APP_ENV manquant}

services:
  server:
    image: ${IMAGE_REGISTRY:-ghcr.io/juc0ag0g0}/dos-d-ane-server:${IMAGE_TAG:-latest}
    build:
      context: ./server
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dosdane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/${POSTGRES_DB:-dosdane}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dosdane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dosdane}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
