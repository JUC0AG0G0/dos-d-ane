# Stack de Dos d'âne : client web (React), serveur (API NestJS) et base PostgreSQL.
# Les valeurs viennent de .env.dev (voir `task dev` et `task up`).
name: dos-d-ane

services:
  client:
    build:
      context: ./client
    restart: unless-stopped
    # nginx sert le front compilé et relaie /api au serveur.
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
