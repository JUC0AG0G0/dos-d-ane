[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dosdane-sensors"
version = "0.0.1"
description = "Acquisition des données capteurs de Dos d'âne (Raspberry Pi)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Groupe Dos d'âne (Master UHA 4.0)" }]
# Aucune dépendance : le paquet reste léger sur Raspberry Pi.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
dosdane-sensors = "dosdane_sensors.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
