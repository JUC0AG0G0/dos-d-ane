<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Points de posture</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font: 14px/1.4 -apple-system, system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      body {
        height: 100vh;
        display: flex;
        align-items: center;
      }
      #scene {
        position: relative;
        width: 100%;
        background: #111;
        aspect-ratio: 3 / 4;
      }
      #video,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #video {
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- playsinline + muted : obligatoire pour que iOS joue la vidéo sans
           passer en plein écran, et sans geste de l'utilisateur. -->
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <script src="./pose.js"></script>
  </body>
</html>
