<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Points de posture</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font: 14px/1.4 -apple-system, system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #scene {
        position: relative;
        width: 100%;
        background: #111;
        aspect-ratio: 3 / 4; /* remplacé par le vrai rapport de la vidéo */
      }
      #video,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #video {
        /* La boîte #scene reçoit en JS le rapport d'aspect exact de la vidéo,
           donc `contain` ne rogne ni ne déforme rien, et le canvas (étiré sur
           la même boîte) reste pile aligné sur l'image. */
        object-fit: contain;
      }
      #panneau {
        padding: 12px 16px;
        display: grid;
        gap: 6px;
      }
      .ligne {
        font-size: 16px;
        font-weight: 600;
      }
      .etat {
        font-size: 12px;
        color: #9aa0a6;
      }
      .etat.erreur {
        color: #e74c3c;
        font-weight: 600;
      }
      #fps {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: #9aa0a6;
      }
      #cote {
        font-size: 12px;
        color: #9aa0a6;
      }
      /* Mode session (?mode=session) : l'écran de l'app affiche les mesures,
         la page ne montre que la vidéo et les points, centrés. */
      body.session {
        height: 100vh;
        display: flex;
        align-items: center;
      }
      body.session #panneau {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- playsinline + muted : obligatoire pour que iOS joue la vidéo sans
           passer en plein écran, et sans geste de l'utilisateur. -->
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="panneau">
      <div class="ligne" id="cou">Cou : —</div>
      <div class="ligne" id="tronc">Tronc : —</div>
      <div id="cote"></div>
      <div id="fps">— FPS</div>
      <div class="etat" id="etat">Démarrage…</div>
    </div>

    <!-- Librairies et modèle téléchargés depuis le CDN au premier chargement.
         Versions figées pour que le test soit reproductible. -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
    <script src="./posture.js"></script>
    <script src="./pose.js"></script>
  </body>
</html>
