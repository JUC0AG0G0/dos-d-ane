# Surcharge de production (déploiement sur le serveur, voir deployReadME.md).
# Les images viennent de la registry (construites sur develop), rien n'est
# compilé ici : SERVER_TAG et CLIENT_TAG valent une version (1.2.0) en prod,
# ou tree-<empreinte> pour le test de préprod. Ils sont fournis par la CI.
# Seul le client (nginx) est publié : il sert le front et relaie /api au
# serveur. L'API et la base restent dans le réseau Docker, pgAdmin n'existe pas.
# Chaque autre ${VAR} sans valeur par défaut doit être un secret GitHub et
# figurer dans .env.prod.example (vérifié par la CI).
x-database-url: &database-url postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}

services:
  client:
    image: ${REGISTRY:-ghcr.io/juc0ag0g0/dos-d-ane}-client:${CLIENT_TAG:?}
    build: !reset null
    ports: !override
      - "${CLIENT_PORT:-80}:80"

  migrate:
    image: ${REGISTRY:-ghcr.io/juc0ag0g0/dos-d-ane}-server-migrate:${SERVER_TAG:?}
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  server:
    image: ${REGISTRY:-ghcr.io/juc0ag0g0/dos-d-ane}-server:${SERVER_TAG:?}
    build: !reset null
    environment:
      APP_ENV: production
      APP_VERSION: ${SERVER_TAG:?}
      CORS_ORIGINS: ""
      SWAGGER_ENABLED: "false"
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    ports: !reset []
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports: !reset []
