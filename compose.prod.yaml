# Surcharge de production (déploiement sur le serveur, voir deployReadME.md).
# Seul le client (nginx) est publié : il sert le front et relaie /api au
# serveur. L'API et la base restent dans le réseau Docker, pgAdmin n'existe pas.
# Chaque ${VAR} sans valeur par défaut doit être un secret GitHub et figurer
# dans .env.prod.example (vérifié par la CI).
x-database-url: &database-url postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}

services:
  client:
    ports: !override
      - "${CLIENT_PORT:-80}:80"

  migrate:
    build:
      context: ./server
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      args:
        APP_VERSION: ${APP_VERSION:-prod}
    environment:
      APP_ENV: production
      CORS_ORIGINS: ""
      SWAGGER_ENABLED: "false"
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    ports: !reset []
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports: !reset []
