# Versions des outils du projet, gérées par mise (https://mise.jdx.dev).
# Les commandes sont dans Taskfile.yml.
min_version = "2026.1.0"

[tools]
node = "26"
python = "3.11"
task = "3"

[settings]
# Nécessaire pour les hooks ci-dessous.
experimental = true

[hooks]
# À chaque entrée dans le dossier : installe les outils manquants, lance
# `task setup` (instantané si tout est déjà fait) puis affiche le bilan.
enter = "cd \"$MISE_PROJECT_ROOT\" && mise install --quiet; command -v task >/dev/null 2>&1 && task --silent setup; sh scripts/doctor.sh --quiet"
