# Commandes du projet (https://taskfile.dev). `task` sans argument liste tout.
#   task setup            # dépendances + hooks Git
#   task check            # lint + compilation (lancé par Husky avant push)
#   task dev              # stack Docker de dev
#   task up ENV=staging   # stack avec l'image publiée
version: "3"

vars:
  ENV: '{{.ENV | default "development"}}'
  COMPOSE: docker compose --env-file .env.{{.ENV}} -f compose.yaml

tasks:
  default:
    silent: true
    cmd: task --list

  doctor:
    desc: Vérifie les versions des outils et l'installation du projet
    cmd: sh scripts/doctor.sh

  setup:
    desc: Installe les dépendances et active les hooks Git
    deps: [install]
    cmd: npm install --no-audit --no-fund

  install:
    desc: Installe les dépendances du serveur (automatique si le lockfile a changé)
    dir: server
    cmd: npm ci --no-audit --no-fund
    # Ne relance l'installation que si package-lock.json a changé ou si
    # node_modules est absent : lint, build et start l'appellent sans coût.
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]

  # --- Vérifications (Husky et CI) ----------------------------------------

  lint:
    desc: Lint et formatage (lancé par Husky avant chaque commit)
    deps: [install]
    dir: server
    cmds:
      - npm run lint
      - npm run format:check

  format:
    desc: Formate le code
    deps: [install]
    dir: server
    cmd: npm run format

  build:
    desc: Vérifie que le serveur compile
    deps: [install]
    dir: server
    cmd: npm run build

  check:
    desc: Lint + compilation (lancé par Husky avant chaque push)
    cmds:
      - task: lint
      - task: build

  # --- Serveur hors Docker ------------------------------------------------

  start:
    desc: Lance le serveur en local avec rechargement (lit server/.env)
    deps: [install]
    dir: server
    cmd: npm run start:dev

  # --- Docker -------------------------------------------------------------

  dev:
    desc: Stack de dev avec rechargement à chaud (API :3000, db :5432)
    cmd: docker compose --env-file .env.development -f compose.yaml -f compose.dev.yaml up

  up:
    desc: "Stack avec l'image publiée (ex. : task up ENV=staging)"
    cmds:
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up -d"

  down:
    desc: Arrête la stack (les données de la base sont conservées)
    cmd: "{{.COMPOSE}} down"

  logs:
    desc: Suit les logs de la stack
    cmd: "{{.COMPOSE}} logs -f"

  ps:
    desc: État des conteneurs
    cmd: "{{.COMPOSE}} ps"
