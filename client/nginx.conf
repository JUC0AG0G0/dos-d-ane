# Sert le front compilé et relaie /api au serveur (même origine, sans CORS).
server {
  listen 80;
  root /usr/share/nginx/html;

  # WebSocket du Raspberry Pi : il faut relayer Upgrade/Connection, sinon nginx la coupe.
  location = /api/devices/ws {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location /api/ {
    # nginx refuse par défaut les corps de plus de 1 Mo (413) : les médias des
    # Conseils vont jusqu'à 5 Mo (MEDIA_MAX_BYTES), plus l'enveloppe multipart.
    client_max_body_size 6m;
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Routes React Router : toute URL inconnue renvoie index.html.
  location / {
    try_files $uri /index.html;
  }
}
