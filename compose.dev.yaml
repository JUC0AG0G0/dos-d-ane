# Surcharge de développement : code monté en volume et rechargement à chaud (`task dev`).
services:
  server:
    image: node:26-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm ci && npm run start:dev"
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules

volumes:
  server-node-modules:
